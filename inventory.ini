# Servers to join to AD. Use ansible_host=<IP> if the control node can't resolve the name.
# Group them however you like - the playbook runs on everything in linux_prod.

[rhel]
tester1 ansible_host=<TESTER1_IP>
tester2 ansible_host=<TESTER2_IP>
# rhel7box ansible_host=<RHEL7_IP>          # RHEL 7 - see README "RHEL 7 notes"

[ubuntu]
# Ubuntu usually blocks root SSH: connect as a sudo user and add -K to the command
# ubu1 ansible_host=<UBUNTU_IP> ansible_user=<your-ubuntu-user> ansible_become=true

[linux_prod:children]
rhel
ubuntu

# Run on the test servers only:
#   ansible-playbook -i inventory.ini ad-join.yml -u root --ask-vault-pass --limit tester1,tester2
