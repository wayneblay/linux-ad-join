---
# ---- Active Directory ----
ad_domain: corp.example.com               # lowercase DNS name of the domain
ad_realm: CORP.EXAMPLE.COM                # same, uppercase (Kerberos realm)
ad_computer_ou: "OU=Linux,OU=Servers,DC=corp,DC=example,DC=com"
ad_join_user: svc_linuxjoin               # account with rights to create computer objects in the OU above
ad_join_password: "{{ vault_ad_join_password }}"   # stored in vault.yml (encrypted)

# ---- Access control (AD group names, no domain suffix) ----
ad_login_groups:
  - linux-prod-users
  - linux-prod-admins
ad_sudo_group: linux-prod-admins
ad_sudo_nopasswd: false                   # true = sudo without password prompt (not recommended)

# ---- Time sync (Kerberos fails beyond 5 min skew) ----
ntp_servers:
  - dc01.corp.example.com
  - dc02.corp.example.com

# ---- Login behaviour ----
use_fully_qualified_names: false          # log in as "jsmith" rather than "jsmith@corp.example.com"
home_dir_pattern: /home/%u
enable_gssapi_sso: true                   # passwordless SSH from domain-joined workstations via Kerberos
