---
# Create the dedicated Ansible service account (ansible-srv) on every server:
# key-only SSH login, passwordless sudo (validated), SELinux labels fixed.
# See ANSIBLE-SERVICE-ACCOUNT.md.
#
# Run ONCE with your current access, e.g.:
#   ansible-playbook -i inventory.ini create-service-account.yml -u root \
#     -e svc_pubkey_file=/tmp/ansible-mgr.pub -e control_node_ip=<CONTROL_NODE_IP>
# Ubuntu servers (sudo user): add -K

- name: Create the Ansible service account
  hosts: linux_prod
  become: true

  vars:
    svc_user: ansible-srv
    # Public key of ansible-mgr on the control node (read on the control node)
    svc_pubkey_file: "~/.ssh/id_ed25519.pub"
    # Recommended: only accept this key from the control node's IP
    control_node_ip: ""
    # Lookups always read files on the control node
    svc_pubkey: "{{ lookup('ansible.builtin.file', svc_pubkey_file) | trim }}"

  tasks:
    - name: Create the service account with a locked password (key login only)
      ansible.builtin.user:
        name: "{{ svc_user }}"
        shell: /bin/bash
        create_home: true
        password_lock: true
        comment: Ansible automation (key login only)

    - name: Create its .ssh folder
      ansible.builtin.file:
        path: "/home/{{ svc_user }}/.ssh"
        state: directory
        owner: "{{ svc_user }}"
        group: "{{ svc_user }}"
        mode: "0700"

    - name: Install the control node's key (restricted to the control node IP if set)
      ansible.builtin.copy:
        dest: "/home/{{ svc_user }}/.ssh/authorized_keys"
        content: |
          {{ ('from="' ~ control_node_ip ~ '" ') if control_node_ip | length > 0 else '' }}{{ svc_pubkey }}
        owner: "{{ svc_user }}"
        group: "{{ svc_user }}"
        mode: "0600"

    - name: Fix SELinux labels on .ssh (RHEL - otherwise key login can silently fail)
      ansible.builtin.command: restorecon -R /home/{{ svc_user }}/.ssh
      changed_when: false
      when:
        - ansible_selinux is defined
        - ansible_selinux.status | default('disabled') == 'enabled'

    - name: Allow passwordless sudo for the service account (validated before saving)
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ svc_user }}"
        content: |
          # Managed by Ansible (create-service-account.yml)
          {{ svc_user }} ALL=(ALL) NOPASSWD: ALL
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Next step
      ansible.builtin.debug:
        msg: >-
          {{ svc_user }} is ready on {{ inventory_hostname }}. Test from the control node with:
          ansible -i inventory.ini {{ inventory_hostname }} -u {{ svc_user }} -b -m command -a whoami
